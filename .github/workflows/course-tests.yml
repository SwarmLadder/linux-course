name: Validate Linux & Bash course
on: [push, pull_request]
permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check all Bash syntax
        run: find labs/reference labs/starter projects/examples -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Grade reference labs
        run: python tools/grade.py --verify-references
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
